name: Hourly Telegram Claimer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Ensures only one run happens at a time to prevent state.json conflicts
concurrency:
  group: telegram-claimer
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          mode: 'wireguard'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Chrome & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=*] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Cycle
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          INITIAL_CHANNEL_USERNAME: ${{ secrets.INITIAL_CHANNEL_USERNAME }}
        run: python main.py

      # Upload screenshots if the browser fails
      - name: Upload Debug Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: "*.png"
          if-no-files-found: ignore

      - name: Commit and Push State Changes
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # Ensure state.json is tracked even if it was just created
          git add -f state.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Update state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to state.json."
          fi

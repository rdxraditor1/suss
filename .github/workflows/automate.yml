name: Hourly Telegram Claimer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: telegram-claimer
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Swapped to a more reliable WARP action and added a timeout
      - name: Setup Cloudflare WARP
        uses: hjenryin/cloudflare-warp-action@main
        timeout-minutes: 3

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Chrome & Xvfb)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
          
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Cycle
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          INITIAL_CHANNEL_USERNAME: ${{ secrets.INITIAL_CHANNEL_USERNAME }}
        run: python main.py

      - name: Upload Debug Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: "*.png"
          if-no-files-found: ignore

      - name: Commit and Push State Changes
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -f state.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Update state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to state.json."
          fi
